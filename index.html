<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexa Fashion Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    :root{
      --gold:    #C8A96E;
      --gold2:   #E8C97A;
      --gold3:   #F5E0A0;
      --blush:   #E8C4B8;
      --dark:    #1A1208;
      --marble1: #F5F0E8;
      --marble2: #EDE5D8;
      --cream:   #FAF6EF;
      --charcoal:#2C1F0E;
    }

    /* ── DARK MODE ── */
    body.dark-mode {
      background-color: #0D0A05;
      color: #E8D5B0;
      background-image:
        repeating-linear-gradient(128deg,transparent 0px,transparent 18px,rgba(200,169,110,0.05) 18px,rgba(200,169,110,0.05) 19px,transparent 19px,transparent 38px,rgba(180,140,60,0.04) 38px,rgba(180,140,60,0.04) 39px),
        repeating-linear-gradient(52deg,transparent 0px,transparent 42px,rgba(200,169,110,0.03) 42px,rgba(200,169,110,0.03) 43px),
        radial-gradient(ellipse 120% 80% at 20% 30%, #1A1208 0%, #0D0A05 100%);
    }
    body.dark-mode::before {
      background:
        radial-gradient(ellipse 35% 25% at 8% 20%, rgba(200,169,110,0.1) 0%, transparent 70%),
        radial-gradient(ellipse 30% 35% at 95% 75%, rgba(200,169,110,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 3% at 30% 45%, rgba(200,169,110,0.08) 0%, transparent 100%);
    }
    body.dark-mode .card {
      background: rgba(26,18,8,0.88);
      border-color: rgba(200,169,110,0.4);
      box-shadow: 0 0 0 1px rgba(200,169,110,0.15), 0 28px 55px rgba(0,0,0,0.5), 0 0 60px rgba(200,169,110,0.08), inset 0 1px 0 rgba(200,169,110,0.1);
    }
    body.dark-mode .ticker-wrap {
      background: rgba(200,169,110,0.08);
      border-color: rgba(200,169,110,0.35);
    }
    body.dark-mode .ticker-track span { color:#E8D5B0; }
    body.dark-mode .tagline { color: rgba(232,213,176,0.5); }
    body.dark-mode .info-box {
      background: rgba(200,169,110,0.06);
      border-color: rgba(200,169,110,0.2);
    }
    body.dark-mode .info-row { color: rgba(232,213,176,0.8); }
    body.dark-mode .footer { color: rgba(232,213,176,0.3); }
    body.dark-mode .btn-tt { background:rgba(232,213,176,0.07);color:#E8D5B0;border-color:rgba(232,213,176,0.2); }
    body.dark-mode .addr-link { color: var(--gold2); }

    /* ── MARBLE BACKGROUND ── */
    body{
      font-family:'Cairo',sans-serif;
      min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px 16px;
      overflow-x:hidden;
      position:relative;
      color:var(--charcoal);

      /* Marble base */
      background-color: var(--marble1);
      background-image:
        /* Gold veins - main diagonal */
        repeating-linear-gradient(
          128deg,
          transparent 0px,
          transparent 18px,
          rgba(180,140,60,0.08) 18px,
          rgba(180,140,60,0.08) 19px,
          transparent 19px,
          transparent 38px,
          rgba(160,120,45,0.06) 38px,
          rgba(160,120,45,0.06) 39px
        ),
        /* Secondary veins */
        repeating-linear-gradient(
          52deg,
          transparent 0px,
          transparent 42px,
          rgba(200,169,110,0.05) 42px,
          rgba(200,169,110,0.05) 43px,
          transparent 43px,
          transparent 85px,
          rgba(180,140,60,0.04) 85px,
          rgba(180,140,60,0.04) 86px
        ),
        /* Warm cream base gradient */
        radial-gradient(ellipse 120% 80% at 20% 30%, #F8F3E8 0%, #EDE5D8 40%, #E5DDD0 100%);
    }

    /* Marble overlay with blobs */
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        /* blush/rose blobs like the store photos */
        radial-gradient(ellipse 35% 25% at 8%  20%,  rgba(232,196,184,0.22) 0%, transparent 70%),
        radial-gradient(ellipse 30% 35% at 95% 75%,  rgba(232,196,184,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 20% 20% at 50% 95%,  rgba(200,169,110,0.12) 0%, transparent 70%),
        /* bright gold vein effect */
        radial-gradient(ellipse 60% 3%  at 30% 45%,  rgba(200,169,110,0.15) 0%, transparent 100%),
        radial-gradient(ellipse 40% 2%  at 70% 60%,  rgba(200,169,110,0.10) 0%, transparent 100%);
    }
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      /* SVG-style diagonal vein lines */
      background-image:
        linear-gradient(128deg,
          transparent 0%,  transparent 22%,
          rgba(180,135,55,0.12) 22%, rgba(180,135,55,0.12) 22.3%,
          transparent 22.3%, transparent 35%,
          rgba(180,135,55,0.07) 35%, rgba(180,135,55,0.07) 35.15%,
          transparent 35.15%, transparent 48%,
          rgba(180,135,55,0.14) 48%, rgba(180,135,55,0.14) 48.4%,
          transparent 48.4%, transparent 60%,
          rgba(180,135,55,0.06) 60%, rgba(180,135,55,0.06) 60.1%,
          transparent 60.1%, transparent 75%,
          rgba(180,135,55,0.10) 75%, rgba(180,135,55,0.10) 75.25%,
          transparent 75.25%, transparent 100%
        );
    }

    /* Subtle dark marble panel at top like store photos */
    .panel-accent{
      position:fixed;top:0;left:0;right:0;height:4px;
      background:linear-gradient(90deg,transparent,var(--gold),#E8C97A,var(--gold),transparent);
      z-index:10;
    }
    .panel-accent-bot{
      position:fixed;bottom:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,transparent,var(--gold),#E8C97A,var(--gold),transparent);
      z-index:10;
    }

    /* All content above bg */
    .ticker-wrap,.card{position:relative;z-index:1;}

    /* ── TICKER ── */
    .ticker-wrap{
      width:100%;max-width:480px;margin-bottom:20px;
      background:rgba(26,18,8,0.06);
      border:1px solid rgba(200,169,110,0.4);
      border-radius:60px;height:40px;overflow:hidden;
      direction:ltr;
      box-shadow:0 2px 12px rgba(200,169,110,0.15), inset 0 1px 0 rgba(255,255,255,0.5);
      backdrop-filter:blur(4px);
    }
    .ticker-track{
      display:inline-flex;align-items:center;height:100%;
      white-space:nowrap;animation:tickerMove 30s linear infinite;
    }
    @keyframes tickerMove{
      0%{transform:translateX(-50%)}100%{transform:translateX(0)}
    }
    .ticker-track span{
      display:inline-flex;align-items:center;gap:8px;
      font-size:.82rem;font-weight:700;padding:0 28px;
      color:var(--charcoal);flex-shrink:0;direction:rtl;opacity:.85;
    }
    .ticker-track span i{color:var(--gold);font-size:.85rem;filter:drop-shadow(0 0 3px rgba(200,169,110,.5));}
    .ticker-wrap:hover .ticker-track{animation-play-state:paused}

    /* ── CARD ── */
    .card{
      width:100%;max-width:430px;
      background:rgba(250,246,239,0.82);
      backdrop-filter:blur(16px);
      border-radius:32px;
      border:1px solid rgba(200,169,110,0.35);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.65),
        0 28px 55px rgba(60,40,10,0.18),
        0 0 40px rgba(200,169,110,0.1),
        inset 0 1px 0 rgba(255,255,255,0.8);
      padding:2rem 1.8rem 1.8rem;
      text-align:center;
      animation:fadeUp .85s cubic-bezier(.2,.9,.4,1.1) both;
      position:relative;overflow:hidden;
    }
    /* top gold rule on card */
    .card::before{
      content:"";
      position:absolute;top:0;left:50%;transform:translateX(-50%);
      width:65%;height:1.5px;
      background:linear-gradient(90deg,transparent,var(--gold2),var(--gold),var(--gold2),transparent);
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(28px) scale(.97)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    /* ── LOGO ── */
    .logo-wrap{margin-bottom:.9rem;display:flex;justify-content:center;}
    .logo-img{
      width:185px;height:auto;border-radius:18px;
      box-shadow:0 0 0 1px rgba(200,169,110,0.3),0 6px 20px rgba(60,40,10,0.18);
      transition:.4s;
    }
    .logo-img:hover{transform:scale(1.03);box-shadow:0 0 0 2px rgba(200,169,110,0.55),0 10px 28px rgba(60,40,10,0.22);}

    /* ── BRAND NAME ── */
    .brand-name{
      font-size:2.8rem;font-weight:900;letter-spacing:.12em;
      margin:.35rem 0 0;
      /* metallic gold-dark treatment matching the store signage */
      background:linear-gradient(160deg,
        #2C1F0E 0%,
        var(--gold) 30%,
        var(--gold2) 50%,
        var(--gold) 70%,
        #2C1F0E 100%);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      display:inline-block;
      filter:drop-shadow(0 1px 2px rgba(200,169,110,0.3));
    }

    /* horizontal gold rule */
    .rule{
      display:flex;align-items:center;gap:10px;
      margin:.6rem 0 .4rem;justify-content:center;
    }
    .rule::before,.rule::after{
      content:"";flex:1;max-width:60px;height:1px;
      background:linear-gradient(90deg,transparent,var(--gold));
    }
    .rule::after{background:linear-gradient(90deg,var(--gold),transparent);}
    .rule-heart{color:var(--gold);font-size:.85rem;}

    .tagline{
      font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;
      color:rgba(44,31,14,.5);font-weight:600;margin-bottom:1.6rem;
    }

    /* ── BUTTONS ── */
    .links{display:flex;flex-direction:column;gap:.85rem;margin-bottom:1.6rem;}

    .btn{
      display:grid;
      grid-template-columns:2rem 1fr auto;
      align-items:center;
      gap:0 10px;
      padding:.9rem 1.2rem;
      border-radius:50px;
      text-decoration:none;font-weight:700;font-size:.97rem;
      border:1px solid transparent;
      transition:all .3s ease;
      position:relative;overflow:hidden;
    }
    /* icon cell – centered */
    .btn .ic{
      display:flex;align-items:center;justify-content:center;
      font-size:1.35rem;
      width:2rem;
      flex-shrink:0;
      transition:transform .25s;
    }
    /* label cell – right-aligned text */
    .btn .lbl{
      text-align:right;
      line-height:1;
    }
    /* arrow cell */
    .btn .arr{
      font-size:.72rem;opacity:.65;
      justify-self:end;
    }
    .btn:active{transform:scale(.97)!important;transition:.07s!important}

    /* WhatsApp */
    .btn-wa{
      background:rgba(37,211,102,.09);color:#1a6e38;
      border-color:rgba(37,211,102,.35);
      animation:floatBtn 3.2s ease-in-out 0s infinite, slideUp .5s ease .1s both;
    }
    .btn-wa:hover{background:#25D366;color:#fff;border-color:transparent;transform:translateY(-4px);
      box-shadow:0 14px 28px -6px rgba(37,211,102,.4);}

    /* Facebook */
    .btn-fb{
      background:rgba(24,119,242,.08);color:#1565c0;
      border-color:rgba(24,119,242,.3);
      animation:floatBtn 3.2s ease-in-out .6s infinite, slideUp .5s ease .2s both;
    }
    .btn-fb:hover{background:#1877F2;color:#fff;border-color:transparent;transform:translateY(-4px);
      box-shadow:0 14px 28px -6px rgba(24,119,242,.4);}

    /* Instagram */
    .btn-ig{
      background:rgba(225,48,108,.07);color:#b5174e;
      border-color:rgba(225,48,108,.28);
      animation:floatBtn 3.2s ease-in-out 1.2s infinite, slideUp .5s ease .3s both;
    }
    .btn-ig:hover{
      background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
      color:#fff;border-color:transparent;transform:translateY(-4px);
      box-shadow:0 14px 28px -6px rgba(225,48,108,.4);
    }

    /* TikTok */
    .btn-tt{
      background:rgba(0,0,0,.05);color:#111;
      border-color:rgba(0,0,0,.15);
      animation:floatBtn 3.2s ease-in-out 1.8s infinite, slideUp .5s ease .4s both;
    }
    .btn-tt:hover{background:#111;color:#fff;border-color:transparent;transform:translateY(-4px);
      box-shadow:0 14px 28px -6px rgba(0,0,0,.35);}

    @keyframes floatBtn{
      0%,100%{box-shadow:0 3px 8px rgba(60,40,10,.08);}
      50%{transform:translateY(-4px);box-shadow:0 12px 20px rgba(60,40,10,.1);}
    }
    @keyframes slideUp{
      from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}
    }

    /* ── INFO BOX ── */
    .info-box{
      background:rgba(26,18,8,.04);
      border:1px solid rgba(200,169,110,.28);
      border-radius:20px;
      padding:1.1rem 1.2rem;
      text-align:right;
      margin-bottom:1.3rem;
    }
    .info-row{
      display:flex;align-items:flex-start;gap:12px;
      margin-bottom:.8rem;font-size:.88rem;
      color:rgba(44,31,14,.75);line-height:1.6;font-weight:500;
      animation:slideIn .5s ease backwards;
    }
    .info-row:last-child{margin-bottom:0}
    .info-row:nth-child(1){animation-delay:.25s}
    .info-row:nth-child(2){animation-delay:.4s}
    .info-row i{
      color:var(--gold);font-size:1rem;min-width:22px;text-align:center;
      margin-top:3px;flex-shrink:0;
    }
    .info-row span{flex:1;}
    @keyframes slideIn{
      from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}
    }

    .footer{font-size:.7rem;color:rgba(44,31,14,.3);letter-spacing:.5px;}
    .footer span{color:var(--gold);}
    .footer a{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold);transition:.2s;}
    .footer a:hover{color:var(--gold2);}

    /* ── ADDRESS LINK ── */
    .addr-link {
      color: var(--charcoal);
      text-decoration: none;
      border-bottom: 1.5px solid var(--gold);
      padding-bottom: 1px;
      transition: color .2s, border-color .2s;
    }
    .addr-link:hover { color: var(--gold); border-color: var(--gold2); }

    /* ── DARK MODE FAB ── */
    .theme-fab {
      position: fixed;
      bottom: 24px;
      left: 20px;
      z-index: 100;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      box-shadow: 0 4px 18px rgba(200,169,110,0.5), 0 2px 6px rgba(0,0,0,0.2);
      transition: transform .3s, box-shadow .3s;
      animation: fabIn .6s cubic-bezier(.2,.9,.4,1.1) both;
    }
    .theme-fab:hover { transform: scale(1.12) rotate(15deg); box-shadow: 0 8px 24px rgba(200,169,110,0.65); }
    .theme-fab:active { transform: scale(.95); }
    body.dark-mode .theme-fab {
      background: linear-gradient(135deg, #2C1F0E, #4A3520);
      box-shadow: 0 4px 18px rgba(0,0,0,0.5), 0 0 20px rgba(200,169,110,0.2);
    }
    @keyframes fabIn {
      from { opacity:0; transform:scale(.5) translateY(20px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }

    @media(max-width:480px){
      .card{padding:1.6rem 1.3rem;}
      .brand-name{font-size:2.2rem;}
      .logo-img{width:160px;}
      .btn{font-size:.88rem;padding:.8rem 1rem;}
    }
  </style>
</head>
